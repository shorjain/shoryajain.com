name: Refresh contributions

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f login=shorjain -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount contributionLevel } }
                  }
                }
              }
            }' > raw.json
          python3 - <<'PY'
          import json
          cal = json.load(open("raw.json"))["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          lv = {"NONE": 0, "FIRST_QUARTILE": 1, "SECOND_QUARTILE": 2, "THIRD_QUARTILE": 3, "FOURTH_QUARTILE": 4}
          days = [{"date": d["date"], "count": d["contributionCount"], "level": lv.get(d["contributionLevel"], 0)}
                  for w in cal["weeks"] for d in w["contributionDays"]]
          json.dump({"total": cal["totalContributions"], "contributions": days}, open("contributions.json", "w"))
          print("total", cal["totalContributions"], "days", len(days))
          PY
          rm raw.json

      # Netlify redeploys on every push, so committing the new data publishes it.
      - name: Commit if changed
        run: |
          git add contributions.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh contributions"
          git push
